[project]
name = "ocproject7"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.4",
    "langchain-ollama>=1.1.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "datasets>=4.8.5",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ragas>=0.4.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests d'intégration lents (chargent un vrai modèle ML, ~10s+)",
]
